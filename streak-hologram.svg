<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="shGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="shClip"><rect x="10" y="34" width="480" height="220" rx="14"/></clipPath>
  </defs>

  <text x="250" y="20" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">🔥 LIVE STREAK FEED</text>

  <rect x="9" y="33" width="482" height="222" rx="15" fill="url(#shBorder)" opacity="0.85"/>
  <rect x="12" y="36" width="476" height="216" rx="12" fill="#060b16"/>

  <g clip-path="url(#shClip)">
    <image x="30" y="52" width="440" height="190" href="https://streak-stats.demolab.com?user=herit007&amp;theme=tokyonight&amp;hide_border=true&amp;background=060b16&amp;ring=2563eb&amp;fire=22d3ee&amp;currStreakLabel=38bdf8" preserveAspectRatio="xMidYMid meet"/>
    <!-- scan flicker for hologram texture -->
    <rect x="10" y="34" width="480" height="3" fill="#67e8f9" opacity="0.5">
      <animate attributeName="y" values="34;254;34" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M 14 50 L 14 38 L 26 38"/>
    <path d="M 474 38 L 486 38 L 486 50"/>
    <path d="M 486 240 L 486 252 L 474 252"/>
    <path d="M 26 252 L 14 252 L 14 240"/>
  </g>

  <!-- rotating ring ornament, top-right -->
  <g transform="translate(462,50)" opacity="0.8">
    <circle r="10" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="3 4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- beam + base -->
  <polygon points="215,255 285,255 265,300 235,300" fill="url(#shBeam)"/>
  <ellipse cx="250" cy="312" rx="95" ry="13" fill="url(#shGlow)">
    <animate attributeName="rx" values="82;98;82" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="312" rx="55" ry="7" fill="#0d1c33" stroke="#38bdf8" stroke-width="1.2"/>

  <text x="250" y="333" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#3d4f70">synced live from GitHub · updates automatically</text>
</svg>
