<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="55%" stop-color="#0a1730"/>
      <stop offset="100%" stop-color="#071022"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1280" height="620" rx="26" ry="26"/>
    </clipPath>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c2c4a" stroke-width="1" opacity="0.35"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1280" height="620" fill="url(#bgGrad)"/>
    <rect width="1280" height="620" fill="url(#grid)"/>

    <circle cx="120" cy="80" r="220" fill="url(#glowBlue)" filter="url(#softBlur)"/>
    <circle cx="1150" cy="540" r="260" fill="url(#glowCyan)" filter="url(#softBlur)"/>

    <!-- floating data points -->
    <g fill="#38bdf8">
      <circle cx="1030" cy="90" r="3" opacity="0.6">
        <animate attributeName="cy" values="90;60;90" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="140" r="2.4" opacity="0.5" fill="#22d3ee">
        <animate attributeName="cy" values="140;110;140" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="60" r="2" opacity="0.4" fill="#818cf8">
        <animate attributeName="cy" values="60;35;60" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="480" r="2.6" opacity="0.4" fill="#38bdf8">
        <animate attributeName="cy" values="480;450;480" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="60" cy="380" r="2" opacity="0.4" fill="#22d3ee">
        <animate attributeName="cy" values="380;350;380" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- terminal card -->
    <g transform="translate(56,50)">
      <rect width="430" height="46" rx="10" fill="#0d1a30" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#ef4444"/>
      <circle cx="38" cy="23" r="5" fill="#f59e0b"/>
      <circle cx="56" cy="23" r="5" fill="#22c55e"/>
      <text x="78" y="28" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#7dd3fc">
        herit@datalab:~$<tspan fill="#e2e8f0"> cat about.py</tspan>
      </text>
      <rect x="330" y="16" width="8" height="16" fill="#38bdf8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- name -->
    <g transform="translate(56,175)">
      <text x="0" y="0" font-family="'Poppins','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="url(#nameGrad)">
        HERIT TANNA
        <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
      </text>
      <text x="4" y="0" font-family="'Poppins','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="none" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="1">
        HERIT TANNA
      </text>
    </g>

    <!-- cycling roles -->
    <g transform="translate(58,222)" font-family="'JetBrains Mono',monospace" font-size="21" fill="#93c5fd">
      <text opacity="0">
        &gt; AI / ML Enthusiast
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033;0.3;0.333;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text opacity="0">
        &gt; Data Science Student
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033;0.3;0.333;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text opacity="0">
        &gt; Builder @ VisionStack
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033;0.3;0.333;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- tagline box -->
    <g transform="translate(56,262)">
      <rect width="470" height="50" rx="10" fill="#0b1626" stroke="#1e3a5f" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.8s" fill="freeze"/>
      </rect>
      <text x="16" y="31" font-family="'JetBrains Mono',monospace" font-size="14.5" fill="#a5b4cf" opacity="0">
        "Turning raw data into decisions worth trusting."
        <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.8s" fill="freeze"/>
      </text>
    </g>

    <!-- tech pills -->
    <g font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600">
      <g transform="translate(56,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.6s" fill="freeze"/>
        <rect width="76" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="38" y="20" text-anchor="middle" fill="#93c5fd">Python</text>
      </g>
      <g transform="translate(144,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.25s" dur="0.6s" fill="freeze"/>
        <rect width="72" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="36" y="20" text-anchor="middle" fill="#93c5fd">Pandas</text>
      </g>
      <g transform="translate(228,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.6s" fill="freeze"/>
        <rect width="66" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="33" y="20" text-anchor="middle" fill="#93c5fd">NumPy</text>
      </g>
      <g transform="translate(306,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.55s" dur="0.6s" fill="freeze"/>
        <rect width="102" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="51" y="20" text-anchor="middle" fill="#93c5fd">scikit-learn</text>
      </g>
      <g transform="translate(420,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.6s" fill="freeze"/>
        <rect width="80" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="40" y="20" text-anchor="middle" fill="#93c5fd">Power BI</text>
      </g>
      <g transform="translate(56,372)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.85s" dur="0.6s" fill="freeze"/>
        <rect width="56" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="28" y="20" text-anchor="middle" fill="#93c5fd">SQL</text>
      </g>
      <g transform="translate(122,372)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="3s" dur="0.6s" fill="freeze"/>
        <rect width="56" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="28" y="20" text-anchor="middle" fill="#93c5fd">Excel</text>
      </g>
      <g transform="translate(188,372)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="3.15s" dur="0.6s" fill="freeze"/>
        <rect width="54" height="30" rx="15" fill="#0e2038" stroke="#1e40af"/>
        <text x="27" y="20" text-anchor="middle" fill="#93c5fd">DAX</text>
      </g>
    </g>

    <!-- code card -->
    <g transform="translate(56,432)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.9s" fill="freeze"/>
      <rect width="470" height="128" rx="12" fill="#070f1f" stroke="#173059"/>
      <circle cx="20" cy="20" r="4.5" fill="#ef4444"/>
      <circle cx="36" cy="20" r="4.5" fill="#f59e0b"/>
      <circle cx="52" cy="20" r="4.5" fill="#22c55e"/>
      <text x="20" y="46" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#7dd3fc">df <tspan fill="#e2e8f0">= pd.read_csv(</tspan><tspan fill="#facc15">"sales.csv"</tspan><tspan fill="#e2e8f0">)</tspan></text>
      <text x="20" y="70" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#7dd3fc">model.<tspan fill="#e2e8f0">fit(X_train, y_train)</tspan></text>
      <text x="20" y="94" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#e2e8f0">print(f<tspan fill="#facc15">"Accuracy: {acc:.2f}"</tspan>)</text>
      <text x="20" y="118" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#4ade80">&gt;&gt;&gt; Accuracy: 0.94</text>
    </g>

    <!-- neural network signature -->
    <g transform="translate(760,300)">
      <!-- connections -->
      <g stroke="#2563eb" stroke-width="1.4" fill="none" opacity="0.55">
        <path d="M20,30 L160,20"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0s" repeatCount="indefinite"/></path>
        <path d="M20,30 L160,90"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.15s" repeatCount="indefinite"/></path>
        <path d="M20,110 L160,20"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></path>
        <path d="M20,110 L160,90"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></path>
        <path d="M20,190 L160,90"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></path>
        <path d="M20,190 L160,160"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.75s" repeatCount="indefinite"/></path>
        <path d="M160,20 L300,55"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></path>
        <path d="M160,90 L300,55"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></path>
        <path d="M160,90 L300,140"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></path>
        <path d="M160,160 L300,140"><animate attributeName="stroke-dasharray" values="0,220;220,0" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></path>
      </g>
      <!-- nodes: input layer -->
      <g fill="#0e2038" stroke="#38bdf8" stroke-width="1.6">
        <circle cx="20" cy="30" r="9"><animate attributeName="r" values="9;11;9" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="20" cy="110" r="9"><animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="20" cy="190" r="9"><animate attributeName="r" values="9;11;9" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
      </g>
      <!-- hidden layer -->
      <g fill="#102a4a" stroke="#22d3ee" stroke-width="1.6">
        <circle cx="160" cy="20" r="10"><animate attributeName="r" values="10;12.5;10" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="160" cy="90" r="10"><animate attributeName="r" values="10;12.5;10" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="160" cy="160" r="10"><animate attributeName="r" values="10;12.5;10" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
      </g>
      <!-- output layer -->
      <g fill="#132f52" stroke="#818cf8" stroke-width="1.8">
        <circle cx="300" cy="55" r="11"><animate attributeName="r" values="11;14;11" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="300" cy="140" r="11"><animate attributeName="r" values="11;14;11" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>
      </g>
      <text x="90" y="235" font-family="'JetBrains Mono',monospace" font-size="12" fill="#5b6b8c" text-anchor="middle">raw data  &#8594;  model  &#8594;  insight</text>
    </g>

    <!-- footer tagline -->
    <text x="640" y="592" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#3d4f70">Computer Engineering · AI / ML · Data Science — always learning, always building</text>

    <!-- scanline sweep -->
    <rect x="0" y="-40" width="1280" height="40" fill="url(#scanGrad)">
      <animate attributeName="y" values="-40;620" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- outer frame -->
    <rect x="1.5" y="1.5" width="1277" height="617" rx="24" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  </g>
</svg>
