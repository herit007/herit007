    <circle cx="1150" cy="540" r="260" fill="url(#glowCyanL)" filter="url(#softBlurL)"/>

    <g transform="translate(56,50)">
      <rect width="430" height="46" rx="10" fill="#ffffff" stroke="#bcd4f0" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#ef4444"/>
      <circle cx="38" cy="23" r="5" fill="#f59e0b"/>
      <circle cx="56" cy="23" r="5" fill="#22c55e"/>
      <text x="78" y="28" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#0284c7">
