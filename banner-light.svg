        <text x="33" y="20" text-anchor="middle" fill="#1d4ed8">NumPy</text>
      </g>
      <g transform="translate(306,332)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="2.55s" dur="0.6s" fill="freeze"/>
        <rect width="102" height="30" rx="15" fill="#e0edff" stroke="#93c5fd"/>
        <text x="51" y="20" text-anchor="middle" fill="#1d4ed8">scikit-learn</text>
