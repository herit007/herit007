      <rect width="470" height="128" rx="12" fill="#ffffff" stroke="#bcd4f0"/>
      <circle cx="20" cy="20" r="4.5" fill="#ef4444"/>
      <circle cx="36" cy="20" r="4.5" fill="#f59e0b"/>
      <circle cx="52" cy="20" r="4.5" fill="#22c55e"/>
      <text x="20" y="46" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#0284c7">df <tspan fill="#1e293b">= pd.read_csv(</tspan><tspan fill="#b45309">"sales.csv"</tspan><tspan fill="#1e293b">)</tspan></text>
      <text x="20" y="70" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#0284c7">model.<tspan fill="#1e293b">fit(X_train, y_train)</tspan></text>
      <text x="20" y="94" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#1e293b">print(f<tspan fill="#b45309">"Accuracy: {acc:.2f}"</tspan>)</text>
      <text x="20" y="118" font-family="'JetBrains Mono',monospace" font-size="13.5" fill="#16a34a">&gt;&gt;&gt; Accuracy: 0.94</text>
    </g>
    <!-- hologram character reveal -->
    <defs>
      <clipPath id="holoClipL">
        <rect x="850" y="120" width="360" height="0">
          <animate attributeName="height" values="0;420" dur="1.8s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
        </rect>
      </clipPath>
      <radialGradient id="holoBaseL" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g>
      <ellipse cx="1030" cy="552" rx="170" ry="24" fill="url(#holoBaseL)">
        <animate attributeName="rx" values="150;175;150" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1030" cy="552" rx="90" ry="10" fill="#2563eb" opacity="0.4"/>
      <image x="850" y="120" width="360" height="420" href="herit_character.svg"url(#holoClipL)" preserveAspectRatio="xMidYMid slice"/>
      <rect x="850" y="80" width="360" height="6" fill="#0891b2" opacity="0">
        <animate attributeName="y" values="120;540" dur="1.8s" begin="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.9;1" dur="1.8s" begin="0.5s" fill="freeze"/>
      </rect>
      <g clip-path="url(#holoClipL)" opacity="0.3">
        <rect x="850" y="120" width="360" height="2" fill="#0891b2">
          <animate attributeName="y" values="120;540;120" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
        </rect>
