    <text x="640" y="592" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#7188ab">Computer Engineering · AI / ML · Data Science — always learning, always building</text>

    <rect x="1.5" y="1.5" width="1277" height="617" rx="24" fill="none" stroke="#bcd4f0" stroke-width="1.5"/>
  </g>
