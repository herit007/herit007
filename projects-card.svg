      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pcGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1c2c4a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="pcClip"><rect width="720" height="470" rx="20"/></clipPath>
  </defs>

