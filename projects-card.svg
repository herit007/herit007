<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="55%" stop-color="#0a1730"/>
      <stop offset="100%" stop-color="#071022"/>
    </linearGradient>
    <linearGradient id="pcBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="pcGlow" cx="50%" cy="50%" r="50%">
