name: Update Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 03:00 UTC
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=herit007&theme=tokyonight&hide_border=true&background=0A0E1A&ring=2563EB&fire=22D3EE&currStreakLabel=38BDF8
          path: streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push
