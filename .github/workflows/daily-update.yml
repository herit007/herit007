# Automated workflow to keep the GitHub Profile README updated with fresh tactical tips and system status.
# Optimized for natural contribution graph synchronization.

name: Daily Profile Update

on:
  schedule:
    # Runs at 12:30 UTC every day
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  sync-and-rotate:
    name: Sync README and Rotate Tip
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Execute Update Engine
        run: python3 update.py

      - name: 🚀 Deploy Changes
        run: |
          git config user.name "Herit Tanna"
          git config user.email "blender740@gmail.com"

          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "chore: automated daily status and tip synchronization"
            git push origin HEAD
          else
            echo "Profile is already synchronized. No deployment needed."
          fi
