name: Daily Profile Update

on:
  schedule:
    # Runs at 12:30 UTC every day to ensure the tip rotates once a day
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual triggering for testing purposes

permissions:
  contents: write

jobs:
  maintenance:
    name: Profile Status Synchronization
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Execute Update Engine
        run: python3 update.py

      - name: 🚀 Deploy Changes
        run: |
          # Configure Git to use the actor's identity for natural graph contributions
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add README.md

          # Only commit and push if there are actual changes detected
          if ! git diff --staged --quiet; then
            git commit -m "System: Automated daily status and tip synchronization"
            git push origin HEAD
          else
            echo "Profile is already synchronized. No deployment needed."
          fi
