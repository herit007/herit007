<svg viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2b47"/>
      <stop offset="60%" stop-color="#0d1c33"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="nbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16283f" stroke-width="1" opacity="0.4"/>
    </pattern>
    <clipPath id="nbClip"><rect x="1" y="1" width="418" height="188" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="418" height="188" rx="14" fill="#0a0e1a" stroke="#1e3a5f"/>
  <g clip-path="url(#nbClip)">
    <rect x="1" y="1" width="418" height="188" fill="url(#nbGrid)"/>
  </g>

  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#38bdf8">🎧 Now Building</text>
  <text x="24" y="54" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5b6b8c">&gt; lo-fi beats to build AI to</text>

  <!-- spinning vinyl record -->
  <g transform="translate(88,124)">
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite" additive="sum"/>
    <circle r="46" fill="url(#vinylGrad)" stroke="#1e3a5f" stroke-width="2"/>
    <circle r="38" fill="none" stroke="#16283f" stroke-width="1"/>
    <circle r="30" fill="none" stroke="#16283f" stroke-width="1"/>
    <circle r="22" fill="none" stroke="#16283f" stroke-width="1"/>
    <circle r="13" fill="#22d3ee"/>
    <circle r="4" fill="#060b16"/>
    <rect x="-2" y="-46" width="4" height="14" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- tonearm -->
  <g transform="translate(88,124)">
    <line x1="30" y1="-30" x2="60" y2="-60" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="-60" r="5" fill="#7dd3fc"/>
  </g>

  <!-- equalizer bars -->
  <g fill="url(#barGrad2)">
    <rect x="210" y="150" width="10" height="20" rx="2">
      <animate attributeName="height" values="20;60;20" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;110;150" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="130" width="10" height="40" rx="2">
      <animate attributeName="height" values="40;75;40" keyTimes="0;0.5;1" dur="1.1s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="130;95;130" keyTimes="0;0.5;1" dur="1.1s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="250" y="100" width="10" height="70" rx="2">
      <animate attributeName="height" values="70;35;70" keyTimes="0;0.5;1" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;135;100" keyTimes="0;0.5;1" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="270" y="120" width="10" height="50" rx="2">
      <animate attributeName="height" values="50;80;50" keyTimes="0;0.5;1" dur="1.2s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;90;120" keyTimes="0;0.5;1" dur="1.2s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="140" width="10" height="30" rx="2">
      <animate attributeName="height" values="30;65;30" keyTimes="0;0.5;1" dur="1s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;105;140" keyTimes="0;0.5;1" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="310" y="115" width="10" height="55" rx="2">
      <animate attributeName="height" values="55;25;55" keyTimes="0;0.5;1" dur="0.95s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="115;145;115" keyTimes="0;0.5;1" dur="0.95s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="135" width="10" height="35" rx="2">
      <animate attributeName="height" values="35;70;35" keyTimes="0;0.5;1" dur="1.05s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="135;100;135" keyTimes="0;0.5;1" dur="1.05s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="350" y="150" width="10" height="20" rx="2">
      <animate attributeName="height" values="20;50;20" keyTimes="0;0.5;1" dur="0.85s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;120;150" keyTimes="0;0.5;1" dur="0.85s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="200" y1="170" x2="370" y2="170" stroke="#1e3a5f" stroke-width="1"/>

  <text x="24" y="176" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#3d4f70">build. debug. repeat. 🔊</text>
</svg>
