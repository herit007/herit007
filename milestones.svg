<svg viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132a4d"/>
      <stop offset="100%" stop-color="#0d1c33"/>
    </linearGradient>
    <pattern id="msGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16283f" stroke-width="1" opacity="0.4"/>
    </pattern>
    <clipPath id="msClip"><rect x="1" y="1" width="418" height="188" rx="14"/></clipPath>
  </defs>
  <rect x="1" y="1" width="418" height="188" rx="14" fill="#0a0e1a" stroke="#1e3a5f"/>
  <g clip-path="url(#msClip)">
    <rect x="1" y="1" width="418" height="188" fill="url(#msGrid)"/>
    <g opacity="0.14">
      <rect x="90" y="-80" width="1.2" height="50" fill="#38bdf8">
        <animate attributeName="y" values="-80;190" dur="6.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="260" y="-100" width="1.2" height="40" fill="#22d3ee">
        <animate attributeName="y" values="-100;190" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="350" y="-70" width="1.2" height="45" fill="#818cf8">
        <animate attributeName="y" values="-70;190" dur="7.2s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#38bdf8">Snapshot</text>

  <g font-family="'JetBrains Mono',monospace" font-size="12">
    <g transform="translate(24,52)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.6s" fill="freeze"/>
      <rect width="372" height="34" rx="8" fill="url(#chipGrad)" stroke="#1e3a5f"/>
      <text x="14" y="22" fill="#22d3ee">📊</text>
      <text x="38" y="22" fill="#c9d6ea">8 projects across 2 public repositories</text>
    </g>
    <g transform="translate(24,92)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.6s" fill="freeze"/>
      <rect width="372" height="34" rx="8" fill="url(#chipGrad)" stroke="#1e3a5f"/>
      <text x="14" y="22" fill="#22d3ee">🎓</text>
      <text x="38" y="22" fill="#c9d6ea">Diploma, Computer Engineering — A.V.P.T.I Rajkot</text>
    </g>
    <g transform="translate(24,132)" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.6s" fill="freeze"/>
      <rect width="372" height="34" rx="8" fill="url(#chipGrad)" stroke="#1e3a5f"/>
      <text x="14" y="22" fill="#22d3ee">🤖</text>
      <text x="38" y="22" fill="#c9d6ea">AI/ML + Data Science — Red &amp; White Multimedia</text>
    </g>
  </g>
</svg>
