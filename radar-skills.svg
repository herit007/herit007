<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sweepFade" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radarClip"><circle cx="150" cy="150" r="93"/></clipPath>
  </defs>

  <rect x="1" y="1" width="418" height="298" rx="14" fill="#0a0e1a" stroke="#1e3a5f"/>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#38bdf8">Skill Radar</text>
  <text x="24" y="54" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5b6b8c">&gt; scanning proficiency...</text>

  <!-- grid rings -->
  <g fill="none" stroke="#1e3a5f" stroke-width="1">
    <polygon points="150.0,119.6 176.3,134.8 176.3,165.2 150.0,180.4 123.7,165.2 123.7,134.8"/>
    <polygon points="150.0,89.3 202.6,119.6 202.6,180.4 150.0,210.7 97.4,180.4 97.4,119.6"/>
    <polygon points="150.0,58.0 229.7,104.0 229.7,196.0 150.0,242.0 70.3,196.0 70.3,104.0"/>
  </g>
  <!-- spokes -->
  <g stroke="#16283f" stroke-width="1">
    <line x1="150" y1="150" x2="150.0" y2="58.0"/>
    <line x1="150" y1="150" x2="229.7" y2="104.0"/>
    <line x1="150" y1="150" x2="229.7" y2="196.0"/>
    <line x1="150" y1="150" x2="150.0" y2="242.0"/>
    <line x1="150" y1="150" x2="70.3" y2="196.0"/>
    <line x1="150" y1="150" x2="70.3" y2="104.0"/>
  </g>

  <!-- rotating sweep -->
  <g clip-path="url(#radarClip)">
    <path d="M 150 150 L 150 58 A 92 92 0 0 1 229.7 104 Z" fill="url(#sweepFade)">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- value polygon -->
  <polygon points="150.0,65.4 212.1,114.1 216.9,188.6 150.0,223.6 79.9,190.5 95.8,118.7" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- skill points that "ping" as the sweep passes -->
  <g fill="#22d3ee">
    <circle cx="150.0" cy="65.4" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="212.1" cy="114.1" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="0.667s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="0.667s" repeatCount="indefinite"/>
    </circle>
    <circle cx="216.9" cy="188.6" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="1.333s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="1.333s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150.0" cy="223.6" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="79.9" cy="190.5" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="2.667s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="2.667s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95.8" cy="118.7" r="3.4">
      <animate attributeName="r" values="3.4;6.5;3.4" dur="4s" begin="3.333s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="3.333s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- axis labels -->
  <g font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#c9d6ea">
    <text x="150" y="30" text-anchor="middle">Python</text>
    <text x="252" y="90" text-anchor="start">SQL</text>
    <text x="252" y="212" text-anchor="start">Power BI</text>
    <text x="150" y="282" text-anchor="middle">scikit-learn</text>
    <text x="48" y="212" text-anchor="end">Pandas</text>
    <text x="48" y="90" text-anchor="end">Excel</text>
  </g>

  <circle cx="150" cy="150" r="2" fill="#67e8f9"/>
</svg>
